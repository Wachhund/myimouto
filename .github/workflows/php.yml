name: PHP CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: pcov

      - name: Validate composer files
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Ensure Composer cache directory exists
        run: mkdir -p "${{ steps.composer-cache-dir.outputs.dir }}"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer audit
        run: composer audit --format=plain
        continue-on-error: true

      - name: PHP lint
        run: composer run-script ci:lint

      - name: Detect code coverage driver
        id: coverage-driver
        run: |
          if php -r "exit((extension_loaded('pcov') || extension_loaded('xdebug') || PHP_SAPI === 'phpdbg') ? 0 : 1);"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No coverage driver available; running PHPUnit without coverage."
          fi

      - name: PHPUnit + Coverage
        if: ${{ steps.coverage-driver.outputs.enabled == 'true' }}
        run: |
          mkdir -p coverage
          composer run-script test:coverage

      - name: PHPUnit (without coverage fallback)
        if: ${{ steps.coverage-driver.outputs.enabled != 'true' }}
        run: composer run-script test

      - name: Upload Coverage Artifact
        if: ${{ steps.coverage-driver.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-coverage
          path: coverage/clover.xml
          if-no-files-found: error

      - name: Upload Coverage to Codecov
        if: ${{ steps.coverage-driver.outputs.enabled == 'true' }}
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          files: coverage/clover.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Asset build
        run: composer run-script assets:build

      - name: PHPStan
        run: composer run-script analyse

      - name: PHP CS Fixer (dry-run)
        run: composer run-script cs-check
